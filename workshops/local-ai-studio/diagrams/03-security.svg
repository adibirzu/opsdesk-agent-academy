<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="800" viewBox="0 0 1300 800" role="img">
<title>Three boundaries a prompt cannot grant itself</title>
<rect width="100%" height="100%" fill="#faf8f2"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<text x="40" y="43" font-family="sans-serif" font-size="26" font-weight="600" fill="#2d352d">Three boundaries a prompt cannot grant itself</text>
<text x="40" y="78" font-family="sans-serif" font-size="14" fill="#6d7864">Design + source mapping · provider acceptance remains a separate check</text>
<path d="M250 188 L390 188" stroke="#a45b43" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="290.0" y="163.0" width="60" height="22" fill="#faf8f2"/>
<text x="320.0" y="178.0" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#a45b43">intent</text>
<path d="M485 226 L485 420" stroke="#a45b43" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="455.0" y="298.0" width="60" height="22" fill="#faf8f2"/>
<text x="485.0" y="313.0" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#a45b43">change</text>
<path d="M580 188 L720 188" stroke="#a45b43" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="620.0" y="163.0" width="60" height="22" fill="#faf8f2"/>
<text x="650.0" y="178.0" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#a45b43">query</text>
<path d="M910 188 L1050 188" stroke="#53644b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="948.5" y="163.0" width="63" height="22" fill="#faf8f2"/>
<text x="980.0" y="178.0" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#53644b">tool call</text>
<path d="M1050 188 L910 458" stroke="#a45b43" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="917.0" y="298.0" width="126" height="22" fill="#faf8f2"/>
<text x="980.0" y="313.0" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#a45b43">unknown or invalid</text>
<path d="M1145 226 L1145 420" stroke="#a45b43" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="1106.5" y="298.0" width="77" height="22" fill="#faf8f2"/>
<text x="1145.0" y="313.0" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#a45b43">allowlisted</text>
<path d="M1050 458 L910 688" stroke="#738197" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="927.5" y="548.0" width="105" height="22" fill="#faf8f2"/>
<text x="980.0" y="563.0" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#738197">observed result</text>
<rect x="60" y="150" width="190" height="76" rx="7" fill="#ffffff" stroke="#a4af98" stroke-width="1.4"/>
<text x="155" y="181" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#344030">Explicit request</text>
<text x="155" y="203" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#344030">Query or change intent</text>
<rect x="390" y="150" width="190" height="76" rx="7" fill="#f5e6df" stroke="#a4af98" stroke-width="1.4"/>
<text x="485" y="181" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#344030">Authorize intent</text>
<text x="485" y="203" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#344030">Before model creation</text>
<rect x="720" y="150" width="190" height="76" rx="7" fill="#ffffff" stroke="#a4af98" stroke-width="1.4"/>
<text x="815" y="181" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#344030">Selected model</text>
<text x="815" y="203" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#344030">Untrusted proposals</text>
<rect x="1050" y="150" width="190" height="76" rx="7" fill="#f5e6df" stroke="#a4af98" stroke-width="1.4"/>
<text x="1145" y="181" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#344030">Validate every call</text>
<text x="1145" y="203" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#344030">Name, arguments, budgets</text>
<rect x="390" y="420" width="190" height="76" rx="7" fill="#f5e6df" stroke="#a4af98" stroke-width="1.4"/>
<text x="485" y="451" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#344030">Policy stop</text>
<text x="485" y="473" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#344030">Zero model invocations</text>
<rect x="720" y="420" width="190" height="76" rx="7" fill="#f5e6df" stroke="#a4af98" stroke-width="1.4"/>
<text x="815" y="451" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#344030">Reject unsafe calls</text>
<text x="815" y="473" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#344030">No handler execution</text>
<rect x="1050" y="420" width="190" height="76" rx="7" fill="#ffffff" stroke="#a4af98" stroke-width="1.4"/>
<text x="1145" y="451" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#344030">Execute safe tools</text>
<text x="1145" y="473" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#344030">Untrusted evidence</text>
<rect x="720" y="650" width="190" height="76" rx="7" fill="#ffffff" stroke="#a4af98" stroke-width="1.4"/>
<text x="815" y="681" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#344030">Return bounded result</text>
<text x="815" y="703" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#344030">Keep tool errors visible</text>
<text x="40" y="775" font-family="sans-serif" font-size="12" fill="#7b8573">Solid: application/control flow · dashed: metadata telemetry · Generic editable shapes; no live-topology claim</text></svg>